<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="theme-color" content="#0f766e">
<title>ورد الصلاة على النبي ﷺ</title>
<style>
:root{--bg:#f6f3ea;--card:#fff;--ink:#16302b;--mut:#6b7f7a;--pri:#0f766e;--pri2:#14b8a6;--gold:#c8962e;--line:#e3ded0;--cell:#efeadb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#0e1a18;--card:#162623;--ink:#e8f1ee;--mut:#8fa6a0;--pri:#14b8a6;--pri2:#5eead4;--gold:#e5b653;--line:#24403a;--cell:#1c312d;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
.app{width:100%;max-width:440px;padding:12px 14px 32px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hd h1{font-size:18px;margin:0;text-align:center;flex:1}
.ib{width:42px;height:42px;border-radius:50%;border:0;background:var(--cell);font-size:20px;cursor:pointer;color:var(--ink)}
.sub{text-align:center;color:var(--mut);font-size:13px;margin:6px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px}
.dua{font-size:20px;line-height:1.8;text-align:center;color:var(--pri);font-weight:600}
.main{display:grid;grid-template-columns:64px 1fr 64px;gap:8px;align-items:stretch;margin-top:10px}
.ring{position:relative;aspect-ratio:1;width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:14;stroke-linecap:round}
.bg{stroke:var(--cell)}
.fg{stroke:var(--pri2);transition:stroke-dashoffset .25s}
.tap{position:absolute;inset:10%;border-radius:50%;border:0;background:linear-gradient(145deg,var(--pri),var(--pri2));color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(15,118,110,.35);transition:transform .08s;font-family:inherit}
.tap:active{transform:scale(.95)}
.tap b{font-size:40px;line-height:1}
.tap small{font-size:12px;opacity:.9;margin-top:5px}
.done .tap{background:linear-gradient(145deg,var(--gold),#e8c36a)}
.col{display:flex;flex-direction:column;gap:6px;justify-content:space-between}
.btn{background:var(--cell);border:0;color:var(--ink);border-radius:12px;padding:9px 12px;font:inherit;font-size:14px;cursor:pointer}
.col .btn{padding:0;flex:1;font-size:13px;font-weight:600}
.tm{border-radius:16px;font-size:15px;line-height:1.4;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%}
.tm.on{background:var(--gold);color:#fff}
.tm small{font-size:11px;font-weight:400;opacity:.9}
.row{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
.msg{text-align:center;min-height:22px;color:var(--gold);font-weight:600;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{background:var(--cell);border-radius:14px;padding:10px 4px}
.stats b{display:block;font-size:22px;color:var(--pri)}
.stats span{font-size:12px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}
.c{aspect-ratio:1;border-radius:12px;background:var(--cell);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;color:var(--mut);line-height:1.25}
.c small{font-size:10px;min-height:12px}
.c.ok{background:var(--pri);color:#fff;font-weight:700}
.c.part{background:color-mix(in srgb,var(--pri) 35%,var(--cell));color:var(--ink)}
.c.miss{opacity:.55}
.c.today{outline:2px solid var(--gold);outline-offset:1px}
.c.fut{opacity:.4}
h2{font-size:15px;margin:0 0 4px}
.set{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;margin-top:10px}
input[type=number]{font-size:16px;width:80px;background:var(--cell);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px;font-family:inherit;text-align:center}
.ms{display:flex;gap:6px}.ms input{width:64px}
.fin{text-align:center;color:var(--gold);font-weight:700;margin-top:10px;display:none}
.link{color:var(--mut);font-size:12px;background:none;border:0;cursor:pointer;font-family:inherit;text-decoration:underline}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.ov.on{display:flex}
.box{background:var(--card);width:100%;max-width:440px;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto;color:var(--ink)}
.box h2{display:flex;justify-content:space-between;align-items:center;font-size:17px;margin-bottom:8px}
.ug{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.ug .btn{padding:14px;font-size:16px}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
</style>
</head>
<body>
<div class="app">
  <div class="hd">
    <button class="ib" id="gear" aria-label="الإعدادات">⚙️</button>
    <h1>ورد الصلاة على النبي ﷺ</h1>
    <button class="ib" id="th" aria-label="الثيم">🌙</button>
  </div>
  <div class="sub" id="dayLbl"></div>

  <div class="card">
    <div class="dua">اللهم صلِّ وسلِّم وبارك على سيدنا محمد</div>
    <div class="main">
      <div><button class="btn tm" id="tm"></button></div>
      <div class="ring" id="ring">
        <svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="43"/><circle class="fg" id="fg" cx="50" cy="50" r="43" stroke-dasharray="270.18" stroke-dashoffset="270.18"/></svg>
        <button class="tap" id="tap" aria-label="عدّ"><b id="cnt">0</b><small id="of"></small></button>
      </div>
      <div class="col" id="mcol"></div>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="stats card">
    <div><b id="sStreak">0</b><span>أيام متتالية</span></div>
    <div><b id="sDone">0</b><span>أيام مكتملة</span></div>
    <div><b id="sTotal">0</b><span>صلوات هذا الشهر</span></div>
  </div>

  <div class="card">
    <h2 id="gTitle">أيام الشهر الهجري</h2>
    <div class="grid" id="grid"></div>
    <div class="fin" id="fin">🌙 ما شاء الله، أتممت أيام الشهر كلها! تقبّل الله منك.</div>
  </div>
</div>

<div class="ov" id="uov"><div class="box">
  <h2>تراجع عن <button class="ib" data-close="uov">✕</button></h2>
  <div class="ug" id="ug"></div>
</div></div>

<div class="ov" id="sov"><div class="box">
  <h2>الإعدادات <button class="ib" data-close="sov">✕</button></h2>
  <div class="set"><span>الهدف اليومي</span><input type="number" id="target" min="1" max="1000000"></div>
  <div class="set"><span>أزرار المضاعفات</span><div class="ms" id="mset"></div></div>
  <div class="set"><span>سرعة المؤقت (صلوات في الدقيقة)</span><input type="number" id="rate" min="1" max="1000"></div>
  <hr>
  <div class="row"><button class="btn" id="bk">💾 حفظ نسخة احتياطية</button><button class="btn" id="rs">📥 استرجاع نسخة</button></div>
  <div class="row" style="margin-top:8px"><button class="btn" id="cp">📋 نسخ كنص</button><button class="btn" id="pt">📝 استرجاع من نص</button></div>
  <input type="file" id="rf" accept=".json,application/json,text/plain" style="display:none">
  <hr>
  <div class="row"><button class="btn" id="upd">🔄 تحديث التطبيق</button><button class="btn" id="share">📤 مشاركة التطبيق</button></div>
  <div class="sub" id="ver" style="margin:10px 0 0"></div>
  <div class="row" style="margin-top:8px"><button class="link" id="reset">مسح كل العدّادات</button></div>
</div></div>

<script>
(function(){
var KEY='salawat-wird-v1',$=function(i){return document.getElementById(i)};
function ymd(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(x<10?'0':'')+x}
function today(){return ymd(new Date())}
var S;
try{S=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){S=null}
var sd=null;try{var se=document.getElementById('seed');if(se&&se.textContent.trim())sd=JSON.parse(se.textContent)}catch(e){}
function tot(o){var t=0;if(o&&o.counts)for(var k in o.counts)t+=o.counts[k];return t}
if(sd&&sd.counts&&(!S||!S.counts||tot(sd)>tot(S))){S=sd;S.timer=null}
if(!S||!S.counts){S={start:today(),target:100,counts:{}}}
if(!(S.target>0))S.target=100;
if(!S.mult||S.mult.length!==4)S.mult=[25,125,250,500];
if(!(S.rate>0))S.rate=60;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function ar(n){return String(n).replace(/\d/g,function(d){return '٠١٢٣٤٥٦٧٨٩'[d]})}
function get(d){return S.counts[d]||0}
function fmt(n){return n>=10000?ar((n/1000).toFixed(1).replace('.0',''))+'ك':ar(n)}
function at(d0,i){return new Date(d0.getFullYear(),d0.getMonth(),d0.getDate()+i,12)}
var HF=null;try{HF=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{day:'numeric',month:'numeric',year:'numeric'})}catch(e){}
function hp(d){
  if(HF){try{var o={};HF.formatToParts(d).forEach(function(p){o[p.type]=parseInt(p.value,10)});if(o.day)return o}catch(e){}}
  return {day:d.getDate(),month:d.getMonth()+1,year:d.getFullYear()};
}
function cyc(){
  var n=new Date(),t=new Date(n.getFullYear(),n.getMonth(),n.getDate(),12),h=hp(t);
  var st=at(t,-(h.day-1)),N=hp(at(st,29)).day===1?29:30,name='';
  try{name=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',{month:'long'}).format(t)+' '+ar(h.year)+' هـ'}catch(e){}
  return {t:t,st:st,N:N,idx:h.day-1,name:name};
}
var msgT;
function say(t){$('msg').textContent=t;clearTimeout(msgT);msgT=setTimeout(function(){$('msg').textContent=''},3000)}

function theme(){
  var t=S.theme||((window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light');
  document.documentElement.setAttribute('data-theme',t);
  $('th').textContent=t==='dark'?'☀️':'🌙';
  var m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='dark'?'#0e1a18':'#0f766e';
}
$('th').onclick=function(){S.theme=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';save();theme()};

function drawM(){
  var h='';S.mult.forEach(function(n,i){h+='<button class="btn" data-n="'+n+'">+'+ar(n)+'</button>'});
  h+='<button class="btn" id="undo">↩ تراجع</button>';
  $('mcol').innerHTML=h;
  Array.prototype.forEach.call($('mcol').querySelectorAll('[data-n]'),function(b){b.onclick=function(){bump(+b.getAttribute('data-n'))}});
  $('undo').onclick=function(){
    var u='<button class="btn" data-u="1">−'+ar(1)+'</button>';
    S.mult.forEach(function(n){u+='<button class="btn" data-u="'+n+'">−'+ar(n)+'</button>'});
    $('ug').innerHTML=u;
    Array.prototype.forEach.call($('ug').querySelectorAll('[data-u]'),function(b){b.onclick=function(){bump(-(+b.getAttribute('data-u')));$('uov').classList.remove('on')}});
    $('uov').classList.add('on');
  };
  var s='';S.mult.forEach(function(n,i){s+='<input type="number" min="1" data-m="'+i+'" value="'+n+'">'});
  $('mset').innerHTML=s;
  Array.prototype.forEach.call($('mset').querySelectorAll('[data-m]'),function(inp){inp.onchange=function(){var v=parseInt(inp.value,10);if(v>0){S.mult[+inp.getAttribute('data-m')]=v;save()}drawM()}});
}

function render(){
  var C=cyc(),t=today(),c=get(t),T=S.target,N=C.N;
  $('dayLbl').textContent=(C.name?C.name+' — ':'')+'اليوم '+ar(C.idx+1)+' من '+ar(N);
  $('gTitle').textContent=C.name?'أيام '+C.name:'أيام الشهر';
  $('cnt').textContent=ar(c);$('of').textContent='من '+ar(T);
  $('fg').style.strokeDashoffset=270.18*(1-Math.min(c/T,1));
  $('ring').className='ring'+(c>=T?' done':'');
  var g='',done=0,total=0,i;
  for(i=0;i<N;i++){
    var d=ymd(at(C.st,i)),n=get(d),cls='c';
    total+=n;
    if(n>=T){cls+=' ok';done++}else if(n>0&&d<=t)cls+=' part';
    if(d===t)cls+=' today';else if(d>t)cls+=' fut';else if(n===0)cls+=' miss';
    g+='<div class="'+cls+'"><span>'+ar(i+1)+'</span><small>'+(d<=t?fmt(n):'')+'</small></div>';
  }
  $('grid').innerHTML=g;
  var s=0,j=c>=T?0:1;
  while(j<400&&get(ymd(at(C.t,-j)))>=T){s++;j++}
  $('sStreak').textContent=ar(s);$('sDone').textContent=ar(done);$('sTotal').textContent=ar(total);
  $('fin').style.display=done>=N?'block':'none';
  $('target').value=T;$('rate').value=S.rate;
}
function bump(k){
  var t=today(),before=get(t),after=Math.max(0,before+k);
  S.counts[t]=after;save();
  if(navigator.vibrate&&k>0&&k<10)try{navigator.vibrate(12)}catch(e){}
  if(before<S.target&&after>=S.target)say('ما شاء الله! أتممت ورد اليوم ✨');
  render();
}
$('tap').onclick=function(){bump(1)};
$('target').onchange=function(){var v=parseInt(this.value,10);if(v>0){S.target=v;save()}render()};
$('rate').onchange=function(){var v=parseInt(this.value,10);if(v>0){S.rate=v;save()}render()};
$('reset').onclick=function(){if(confirm('سيتم مسح كل العدّادات. متأكد؟')){S.counts={};S.timer=null;save();render();tick()}};
$('gear').onclick=function(){$('sov').classList.add('on')};
Array.prototype.forEach.call(document.querySelectorAll('[data-close]'),function(b){b.onclick=function(){$(b.getAttribute('data-close')).classList.remove('on')}});
Array.prototype.forEach.call(document.querySelectorAll('.ov'),function(o){o.onclick=function(e){if(e.target===o)o.classList.remove('on')}});
document.addEventListener('visibilitychange',function(){if(!document.hidden){render();tick()}});
['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault()})});

// Timer: based on saved start timestamp, so it keeps counting in background / after the page is suspended
function pad(n){return (n<10?'0':'')+n}
function tick(){
  var b=$('tm');
  if(!S.timer){b.className='btn tm';b.innerHTML='⏱<small>مؤقت</small>';return}
  var sec=Math.max(0,Math.floor((Date.now()-S.timer)/1000));
  b.className='btn tm on';
  b.innerHTML=ar(pad(Math.floor(sec/60))+':'+pad(sec%60))+'<small>إيقاف · ≈'+ar(Math.round(sec*S.rate/60))+'</small>';
}
$('tm').onclick=function(){
  if(!S.timer){S.timer=Date.now();save();tick();say('بدأ المؤقت — يمكنك إنزال التطبيق');return}
  var n=Math.round((Date.now()-S.timer)/60000*S.rate);
  S.timer=null;save();tick();
  if(n>0){bump(n);say('أُضيفت '+ar(n)+' صلاة ﷺ')}else say('المدة قصيرة، لم تُضف صلوات');
};
setInterval(tick,500);

var VER='2026-11-11.4';
$('ver').textContent='الإصدار '+VER;
function backupText(){return JSON.stringify({app:'salawat-wird',v:2,exported:new Date().toISOString(),target:S.target,mult:S.mult,rate:S.rate,counts:S.counts})}
$('bk').onclick=function(){
var txt=backupText(),name='salawat-backup-'+today()+'.json',file;
try{file=new File([txt],name,{type:'application/json'})}catch(e){file=null}
var fb=function(){try{var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);say('تم تجهيز النسخة للحفظ')}catch(e){say('استخدم نسخ كنص')}};
if(file&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:'نسخة ورد الصلاة'}).catch(function(e){if(!e||e.name!=='AbortError')fb()})}else fb()};
function restore(txt){
var o;try{o=JSON.parse(txt)}catch(e){say('النسخة غير صالحة');return}
if(!o||o.app!=='salawat-wird'||!o.counts||typeof o.counts!=='object'){say('النسخة غير صالحة');return}
var added=0,k,v;
for(k in o.counts){v=+o.counts[k];if(/^\d{4}-\d\d-\d\d$/.test(k)&&v>0&&v>get(k)){S.counts[k]=v;added++}}
if(o.target>0)S.target=o.target;
if(o.rate>0)S.rate=o.rate;
if(o.mult&&o.mult.length===4&&o.mult.every(function(x){return x>0}))S.mult=o.mult;
save();drawM();render();say('تم الاسترجاع ✅ ('+ar(added)+' يوم)')}
$('rs').onclick=function(){$('rf').click()};
$('rf').onchange=function(){var f=this.files&&this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){restore(String(r.result))};r.readAsText(f);this.value=''};
$('cp').onclick=function(){var t=backupText();
if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){say('تم النسخ — الصقه في واتساب لنفسك')},function(){window.prompt('انسخ النص:',t)})}else window.prompt('انسخ النص:',t)};
$('pt').onclick=function(){var t=window.prompt('الصق نص النسخة هنا');if(t)restore(t)};
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}

function build(){var c=document.documentElement.cloneNode(true);
Array.prototype.forEach.call(c.querySelectorAll('link'),function(n){n.parentNode.removeChild(n)});
var o=c.querySelector('#seed');if(o)o.parentNode.removeChild(o);
var s=document.createElement('script');s.id='seed';s.type='application/json';s.textContent=JSON.stringify(S).replace(/</g,'\\u003c');
var b=c.querySelector('body');b.insertBefore(s,b.firstChild);
return '<!DOCTYPE html>'+c.outerHTML}
$('share').onclick=function(){
var html=build(),name='index.html',file;
try{file=new File([html],name,{type:'text/html'})}catch(e){file=null}
var fb=function(){try{var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);say('تم تجهيز الملف للحفظ')}catch(e){say('المشاركة غير متاحة هنا')}};
if(file&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:'ورد الصلاة على النبي'}).catch(function(e){if(!e||e.name!=='AbortError')fb()})}else fb()};

function check(manual){
if(!/^https?:/.test(location.protocol)){if(manual)say('التحديث متاح من الرابط فقط');return}
var base=location.href.split('?')[0].split('#')[0];
fetch(base+'?nc='+Date.now(),{cache:'no-store'}).then(function(r){return r.text()}).then(function(h){
var m=h.match(/var VER='([^']+)'/);
if(m&&m[1]!==VER){say('يوجد إصدار أحدث، جارٍ التحديث…');setTimeout(function(){location.replace(base+'?v='+encodeURIComponent(m[1]))},700)}
else if(manual)say('أنت على آخر إصدار ✅')
}).catch(function(){if(manual)say('تعذّر التحقق، تأكد من الاتصال')})}
$('upd').onclick=function(){check(true)};
check(false);

// PWA: manifest + icon embedded as data URIs
var icon='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="110" fill="#0f766e"/><path d="M300 110a150 150 0 1 0 0 292 120 120 0 0 1 0-292z" fill="#f4d58d"/></svg>');
try{
  var l=document.createElement('link');l.rel='icon';l.href=icon;document.head.appendChild(l);
  var a=document.createElement('link');a.rel='apple-touch-icon';a.href=icon;document.head.appendChild(a);
